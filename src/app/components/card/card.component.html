<div class="card bg-base-200 w-full h-full w-96 shadow-sm">
  <figure>
    <img src="{{image}}" />
  </figure>
  <div class="card-body">
    <h2 class="card-title"> {{title}} </h2>
    <p>{{description}}</p>
    <div class="card-actions justify-end text-xl">
      @for (techno of technos; track $index) {
      <fa-icon [icon]="techno" />
      }
    </div>
  </div>
</div>
